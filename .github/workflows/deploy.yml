name: Deploy with PM2

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pull main and start or restart PM2
        env:
          SSH_HOST: ${{ secrets.ORACLE_VM_URL }}
          SSH_USER: ${{ secrets.ORACLE_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle_vm_key"
          chmod 600 "$HOME/.ssh/oracle_vm_key"
          trap 'rm -f "$HOME/.ssh/oracle_vm_key"' EXIT

          ssh-keyscan -T 10 -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"

          ssh -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/oracle_vm_key" \
            "$SSH_USER@$SSH_HOST" \
            'set -euo pipefail
             cd "$HOME/repos/marketing"
             git pull --ff-only origin main
             # Without this a commit that changes package.json deploys green and
             # then crash-loops on the server with MODULE_NOT_FOUND.
             npm ci --omit=dev
             pm2 startOrRestart ecosystem.config.js --only marketing --update-env
             # Give the client a chance to boot, then confirm it actually stayed up
             # rather than reporting success on a process that is crash-looping.
             sleep 60
             pm2 describe marketing | grep -q "status.*online"
             pm2 save'
